# RLinf flow_sde PPO on frozen-VLM pi0.5 Human300, OpenDrawer, simulator
# first-success reward. RLinf robocasa365_opendrawer_ppo_openpi recipe with
# VLRLA (arXiv:2610.19517 A.2.1) exploration/optimizer; only the motor
# (pi0.5 H50/10-step/3-view, as robocasa365_pi05_eval.yaml) and the batch
# needed by H50 chunking differ. Run contract:
# outputs/robocasa-opendrawer-rlinf-sim-ppo-20261102-r1/PLAN.md
defaults:
  - env/robocasa365@env.train
  - env/robocasa365@env.eval
  - model/pi0_5@actor.model
  - weight_syncer/patch_syncer@weight_syncer
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:RLINF_PATH}/examples/embodiment/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:ROBOCASA_SIM_PPO_OUTPUT}
    project_name: robocasa365_sim_ppo
    experiment_name: opendrawer_flow_sde
    logger_backends: [tensorboard]
  # 18 x 51,200 train actions + 2 x 25,600 eval = 972,800 of the 1M budget.
  max_epochs: 18
  max_steps: -1
  use_training_pipeline: false
  overlap_env_bootstrap: false
  weight_sync_interval: 1
  only_eval: ${oc.decode:${oc.env:ROBOCASA_SIM_PPO_ONLY_EVAL,false}}
  val_check_interval: 18
  save_interval: 6
  resume_dir: ${oc.decode:${oc.env:ROBOCASA_SIM_PPO_RESUME,null}}
  ckpt_path: ${oc.decode:${oc.env:ROBOCASA_SIM_PPO_CKPT,null}}

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 4
    total_num_envs: 32
    seed: 210100
    split: target  # same split as our earlier native OpenDrawer numbers
    task_soup: atomic_seen
    task_filter: [OpenDrawer]
    task_mode: atomic
    task_sampling_strategy: random
    # First success: terminate at success, +1 on that step (use_rel_reward),
    # later chunks masked by RLinf. All envs still step the full 400.
    auto_reset: false
    ignore_terminations: false
    use_rel_reward: true
    episode_horizon_source: max_episode_steps
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 400
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    action_space:
      env_action_dim: 12
      gripper_index: 6
      base_mode_index: 11
      binarize_gripper_control: true
      binarize_base_mode_control: true
    init_params:
      camera_heights: 256
      camera_widths: 256
  eval:
    rollout_epoch: 1
    total_num_envs: 64
    seed: 410100
    split: target
    task_soup: atomic_seen
    task_filter: [OpenDrawer]
    task_mode: atomic
    task_sampling_strategy: ordered
    use_fixed_reset_state_ids: true
    auto_reset: false
    # Full 400 steps so both success_once and success_at_end are logged.
    ignore_terminations: true
    episode_horizon_source: max_episode_steps
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 400
    group_size: 1
    is_eval: true
    action_space:
      env_action_dim: 12
      gripper_index: 6
      base_mode_index: 11
      binarize_gripper_control: true
      binarize_base_mode_control: true
    init_params:
      camera_heights: 256
      camera_widths: 256
    video_cfg:
      save_video: true
      info_on_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  model: ${actor.model}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  # 32 envs x 4 epochs x 8 H50 chunks = 1,024 samples/iteration:
  # 4 minibatches x 4 epochs = 16 optimizer steps.
  micro_batch_size: ${oc.decode:${oc.env:ROBOCASA_SIM_PPO_MICRO_BATCH,16}}
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  model:
    model_path: ${oc.env:ROBOCASA_PI05_TORCH_MODEL}
    pi05: true
    precision: null
    num_action_chunks: 50
    action_dim: 12
    num_steps: 10
    add_value_head: true
    openpi:
      task: rl
      config_name: pi05_robocasa365_pretrain_human300
      action_horizon: 50
      action_chunk: 50
      noise_method: flow_sde
      noise_level: 0.3
      train_expert_only: true
      detach_critic_input: true
      value_after_vlm: false
      model_action_dim: 32
      action_env_dim: 12
      num_images_in_input: 3
      discrete_state_input: true
      max_token_len: 200
      torch_compile: false
    openpi_data:
      norm_stats_path: ${oc.env:ROBOCASA_PI05_NATIVE_NORM}
      state_space: 16d
      image_space: 3views
      action_space: 12d
      extra_delta_transform: false
      use_quantile_norm: false
      pad_before_normalization: true
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null

reward:
  use_reward_model: false
critic:
  use_critic_model: false

# Boundary/history sidecars for the unmodified native PPO/Flow-SDE learner.
native_pilot:
  output: ${oc.env:ROBOCASA_SIM_PPO_OUTPUT}
  accounting_root: ${oc.env:ROBOCASA_SIM_PPO_ACCOUNTING}
  world_size: 2
  attempt: ${oc.env:TASK_ATTEMPT}
  deadline_unix: ${oc.decode:${oc.env:TASK_DEADLINE}}
