# Apache-2.0; derived from official RLinf c605b9d adjust_bottle PPO YAML.
# Original file SHA333812d95fa10e7f1b60f7b6f17b74b42a578ff9a2cf8072b7a89061153d3c2b.
# Only explicit pilot/runtime/H400/cadence/storage overrides; learner unchanged.
defaults:
  - env/robotwin_adjust_bottle@env.train
  - env/robotwin_adjust_bottle@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: ${oc.env:NATIVE_PPO_PLACEMENT}

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:NATIVE_PPO_OUTPUT}
    project_name: rlinf
    experiment_name: official-native
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 2
  max_steps: 2

  only_eval: False
  val_check_interval: 2
  save_interval: -1
  use_training_pipeline: false
  overlap_env_bootstrap: false
  enable_decoupled_mode: false
  per_worker_log: true

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  reward_coef: 1.0


  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 5
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: "EnvGroup"
  enable_offload: True
  # Override the default values in env/robotwin_adjust_bottle
  train:
    rollout_epoch: 4
    total_num_envs: 256
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 400
    group_size: ${algorithm.group_size}
    assets_path: ${oc.env:ROBOTWIN_ASSETS_PATH}
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/train_seeds.json
    center_crop: False
    video_cfg:
      save_video: False
    task_config:
      step_lim: 400
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
  eval:
    rollout_epoch: 1
    total_num_envs: 128
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 400
    reward_coef: ${algorithm.reward_coef}
    max_steps_per_rollout_epoch: 400
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    assets_path: ${oc.env:ROBOTWIN_ASSETS_PATH}
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: False
    video_cfg:
      save_video: False
    task_config:
      step_lim: 400
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 2048 # 1024
  seed: 1234
  enable_offload: True

  # Override the default values in model/openpi_pi05
  model:
    model_path: ${oc.env:NATIVE_PPO_MODEL}
    num_action_chunks: 50 # interface for the env
    action_dim: 14
    add_value_head: True
    num_steps: 5
    openpi:
      task: rl
      config_name: "pi05_aloha_robotwin"
      num_images_in_input: 3
      noise_level: 0.3
      detach_critic_input: True

  optim:
    lr_scheduler: constant
    total_training_steps: 0
    lr_warmup_steps: 0
    lr: 5.0e-06
    value_lr: 1.0e-04
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  # Override the default values in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp"
    save_full_model_weights: false
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

native_pilot:
  mode: ${oc.env:NATIVE_PPO_MODE,train}
  output: ${oc.env:NATIVE_PPO_OUTPUT}
  accounting_root: ${oc.env:NATIVE_PPO_ACCOUNTING_ROOT}
  attempt: ${oc.env:NATIVE_PPO_ATTEMPT,attempt-0001}
  deadline_unix: ${oc.env:NATIVE_PPO_DEADLINE}
  world_size: ${oc.env:NATIVE_PPO_WORLD}
  initializer_revision: ${oc.env:NATIVE_PPO_INITIALIZER_REVISION}
