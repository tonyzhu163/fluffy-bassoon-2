# c605 official LIBERO pi0.5 PPO hyperparameters; only execution batch/env
# count, task/partition, full-horizon terminal reward and visibility differ.
defaults:
  - env/libero_90@env.train
  - env/libero_90@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: ${oc.env:FLORA_PPO_PLACEMENT}

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:FLORA_PPO_OUTPUT}
    project_name: flora_ppo
    experiment_name: comparison
    logger_backends: []
  max_epochs: 12
  max_steps: ${oc.decode:${oc.env:FLORA_PPO_ITERATIONS,12}}
  only_eval: ${oc.decode:${oc.env:FLORA_PPO_ONLY_EVAL}}
  val_check_interval: 1
  save_interval: -1
  use_training_pipeline: false
  overlap_env_bootstrap: false
  enable_decoupled_mode: false
  per_worker_log: true
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: EnvGroup
  train:
    total_num_envs: 32
    rollout_epoch: 4
    task_id_filter: [44]
    auto_reset: false
    ignore_terminations: true
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 400
    num_steps_wait: 15
    skip_intermediate_renders: false
    init_params:
      control_freq: 20
    video_cfg:
      save_video: false
      info_on_video: false
  eval:
    total_num_envs: ${oc.decode:${oc.env:FLORA_PPO_EVAL_SLOTS}}
    rollout_epoch: 1
    task_id_filter: [44]
    auto_reset: false
    ignore_terminations: true
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 400
    num_steps_wait: 15
    skip_intermediate_renders: false
    init_params:
      control_freq: 20
    is_eval: true
    video_cfg:
      save_video: false
      info_on_video: false

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: libero
  enable_offload: false
  pipeline_stage_num: 1
  model: ${actor.model}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: ${oc.decode:${oc.env:FLORA_PPO_MICRO_BATCH,32}}
  global_batch_size: 2048
  seed: 42
  enable_offload: false
  model:
    model_path: ${oc.env:FLORA_PPO_MODEL}
    precision: bf16
    pi05: true
    num_action_chunks: 5
    action_dim: 7
    num_steps: 3
    add_value_head: true
    openpi:
      task: rl
      config_name: pi05_libero
      action_horizon: 10
      action_chunk: 5
      discrete_state_input: false
      model_action_dim: 32
      max_token_len: 200
      num_images_in_input: 2
      value_after_vlm: true
    openpi_data:
      norm_stats_path: ${oc.env:FLORA_PPO_NORM}
      extra_delta_transform: false
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    # Preserve c605 Pi0.to_bfloat16_for_selected_params() FP32 islands,
    # Pi0._no_split_modules/_no_split_names and Pi0RL's FP32 value head.
    # Individual boundaries retain the author's automatic bf16 child wraps.
    wrappers:
      openpi_fp32_classes:
        module_classes:
          - rlinf.models.embodiment.openpi.modules.gemma.RMSNorm
          - rlinf.models.embodiment.openpi.modules.siglip.Float32Conv2d
          - rlinf.models.embodiment.openpi.modules.siglip.SigLIPViT
          - rlinf.models.embodiment.modules.value_head.ValueHead
        wrap_mode: individual
      openpi_fp32_projections:
        module_names: [action_in_proj, action_out_proj, time_mlp_in, time_mlp_out]
        wrap_mode: individual
    mixed_precision_policies:
      openpi_fp32:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
        cast_forward_inputs: true
    mixed_precision_rules:
      openpi_fp32_classes: openpi_fp32
      openpi_fp32_projections: openpi_fp32
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false
critic:
  use_critic_model: false

# Only shared recording hooks are reused. The RoboTwin recipe/env/runner are not.
native_pilot:
  output: ${oc.env:FLORA_PPO_OUTPUT}

flora_ppo:
  arm: ${oc.env:FLORA_PPO_ARM}
  phase: ${oc.env:FLORA_PPO_PHASE}
  world_size: ${oc.decode:${oc.env:FLORA_PPO_WORLD}}
  output: ${oc.env:FLORA_PPO_OUTPUT}
  exchange_root: ${oc.env:FLORA_PPO_EXCHANGE}
  monitoring_root: ${oc.env:FLORA_PPO_MONITORING}
  accounting_root: ${oc.env:FLORA_PPO_ACCOUNTING}
  attempt: ${oc.env:FLORA_PPO_ATTEMPT}
  profile_path: ${oc.env:FLORA_PPO_PROFILE}
  profile_sha256: ${oc.env:FLORA_PPO_PROFILE_SHA}
  pending_resume: false
  evaluation_history: null
  rlinf_commit: c605b9d55ed93a180119b099e6f836abff293b08
  initializer_repository: RLinf/RLinf-Pi05-LIBERO-SFT
  initializer_revision: 45ccfcc4e28634f1576ebf78cab0fbe2fd82432d
  initializer_weight_sha256: 4616e4c1966a5fb063b442ea5d69857f45e873222d839b794634d87d252ab9e7
  normalization_sha256: dae37d79a22108af83df9189c6710a3ec8e077d65b28e34bdf1da724e5ae30f1
