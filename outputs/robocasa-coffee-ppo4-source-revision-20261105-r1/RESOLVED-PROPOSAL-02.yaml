      binarize_gripper_control: true
      gripper_index: 6
      binarize_base_mode_control: true
    rollout_epoch: 1
  group_name: EnvGroup
actor:
  model:
    model_type: openpi
    precision: null
    pi05: true
    is_lora: false
    lora_rank: 32
    num_action_chunks: 50
    action_dim: 12
    use_proprio: true
    num_steps: 10
    add_value_head: true
    openpi:
      task: rl
      config_name: pi05_robocasa365_pretrain_human300
      num_images_in_input: 3
      noise_level: 0.3
      action_chunk: 50
      num_steps: 10
      train_expert_only: true
      action_env_dim: 12
      noise_method: flow_sde
      add_value_head: true
      value_after_vlm: true
      value_vlm_mode: mean_token
      detach_critic_input: true
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      torch_compile: false
      action_horizon: 50
      ignore_last: true
      discrete_state_input: true
    model_path: /mowenjie/fluffy-bassoon-2/inputs/robocasa365-public-pi05-c484-torch-20261101-r2
    openpi_data:
      norm_stats_path: /mowenjie/fluffy-bassoon-2/inputs/robocasa365-public-pi05-c484-75000-20261101-r1/assets/norm_stats.json
      state_space: 16d
      image_space: 3views
      action_space: 12d
      extra_delta_transform: false
      use_quantile_norm: false
      pad_before_normalization: true
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    wrappers: {}
    mixed_precision_policies: {}
    mixed_precision_rules: {}
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 16
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  optim:
    lr: 5.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1
    env,rollout: 0-7
runner:
  task_type: embodied
  logger:
    log_path: /mowenjie/fluffy-bassoon-2/outputs/robocasa-coffee-ppo4-source-revision-20261105-r1/source/attempt-01
