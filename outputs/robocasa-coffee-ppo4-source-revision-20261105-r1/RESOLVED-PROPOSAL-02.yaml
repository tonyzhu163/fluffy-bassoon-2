    ignore_done: true
    use_object_obs: true
    use_camera_obs: true
    camera_depths: false
    total_num_envs: 64
    auto_reset: false
    ignore_terminations: true
    episode_horizon_source: max_episode_steps
    max_steps_per_rollout_epoch: 600
    max_episode_steps: 600
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: false
    use_rel_reward: true
    reward_coef: 1.0
    is_eval: true
    seed: 650100
    group_size: 1
    seed_strategy: worker_offset
    video_cfg:
      save_video: true
      info_on_video: false
      video_base_dir: /mowenjie/fluffy-bassoon-2/outputs/robocasa-coffee-ppo4-source-revision-20261105-r1/source/attempt-01/video/eval
    init_params:
      camera_heights: 256
      camera_widths: 256
    observation:
      main_camera_key: robot0_agentview_left_image
      wrist_camera_key: robot0_eye_in_hand_image
      extra_camera_keys:
      - robot0_agentview_right_image
      flip_images_vertical: true
      state_layout:
      - eef_pos
