      down_sample_steps: 1
      shape:
      - 3
      - 224
      - 224
      type: rgb
      ignore_by_policy: false
      prompt_type: observation
      include_in_prompt_current_obs: true
    ee_pos:
      shape:
      - 3
      type: low_dim
      horizon: 2
      down_sample_steps: 1
      ignore_by_policy: false
      prompt_type: proprioception
      include_in_prompt_current_obs: true
    ee_ori:
      shape:
      - 6
      type: low_dim
      horizon: 2
      down_sample_steps: 1
      ignore_by_policy: false
      prompt_type: proprioception
      include_in_prompt_current_obs: true
    gripper_states:
      shape:
      - 2
      type: low_dim
      horizon: 2
      down_sample_steps: 1
      ignore_by_policy: false
      prompt_type: proprioception
      include_in_prompt_current_obs: true
    task_language:
      shape:
      - 77
      type: low_dim
      horizon: 1
      is_language: true
      in_replay_buffer: false
      prompt_type: ignore
      repeat_n_times: 8
      ignore_by_policy: true
    goal_image:
      key: agentview_rgb
      share_rgb_model: agentview_rgb
      horizon: 1
      down_sample_steps: 1
      shape:
      - 3
      - 224
      - 224
      type: rgb
      in_replay_buffer: false
      ignore_by_policy: true
      prompt_type: ignore
      include_in_prompt_current_obs: false
