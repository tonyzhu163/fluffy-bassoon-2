    rep: delta
    components:
    - type: pos
      size: 3
    - type: rot
      size: 6
    - type: gripper_open_close
      size: 1
  obs:
    agentview_rgb:
      horizon: 2
      down_sample_steps: 1
      shape:
      - 3
      - 224
      - 224
      type: rgb
      ignore_by_policy: false
      prompt_type: observation
      include_in_prompt_current_obs: true
    eye_in_hand_rgb:
