[build-system]
requires = ["setuptools>=71,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "fluffy-bassoon-2"
version = "0.1.0"
description = "In-context reinforcement learning for frozen VLAs on RoboCasa and RoboTwin with RLinf"
requires-python = ">=3.11,<3.13"
# Native simulator and RLinf dependencies are installed in pinned benchmark runtimes.
dependencies = ["torch>=2.7", "numpy"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
